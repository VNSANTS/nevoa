<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c16">
<meta name="description" content="Névoa — navegue e pesquise com o Brave Search.">
<title>Névoa</title>
<style>
:root{color-scheme:dark;--bg:#080c16;--panel:#11192a;--panel2:#0d1423;--line:#26334b;--cyan:#50dceb;--muted:#91a0b8;--white:#eef4fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#172b42 0,transparent 46%),var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(860px,92%);margin:auto;min-height:100svh;display:flex;flex-direction:column}
header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}
.logo{font-weight:900;letter-spacing:.15em;color:var(--cyan);font-size:17px}
.status{font-size:11px;letter-spacing:.08em;color:var(--cyan);border:1px solid #50dceb44;border-radius:999px;padding:8px 11px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:55px 0 75px}
.orb{width:68px;height:68px;border:1px solid #50dceb88;border-radius:22px;display:grid;place-items:center;color:var(--cyan);font-size:30px;box-shadow:0 0 55px #50dceb16;margin-bottom:25px;background:#0b1725}
h1{font-size:clamp(38px,8vw,62px);line-height:1.04;letter-spacing:-.055em;margin:0 0 12px}
.accent{color:var(--cyan)}
.subtitle{font-size:14px;color:var(--muted);margin:0 0 30px}
.search{width:min(680px,100%);display:flex;gap:8px;padding:8px;border:1px solid #35445f;border-radius:18px;background:#0c1321;box-shadow:0 14px 50px #0003}
.search:focus-within{border-color:#50dcebaa;box-shadow:0 0 0 3px #50dceb13}
.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--white);font:inherit;font-size:15px;padding:11px 10px}
.search input::placeholder{color:#8290a8}
.search button{border:0;border-radius:12px;background:var(--cyan);color:#06111b;font-weight:800;padding:0 20px;font-size:14px;cursor:pointer}
.search button:active{transform:scale(.98)}
.engine{font-size:12px;color:var(--muted);margin:14px 0 34px}
.engine strong{color:#dfe8f5;font-weight:650}
.shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(600px,100%)}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--white);padding:17px 8px;border:1px solid #ffffff12;border-radius:16px;background:linear-gradient(145deg,#121c2d,#0c1320);transition:border-color .15s,transform .15s}
.shortcut:hover{border-color:#50dceb66;transform:translateY(-2px)}
.glyph{width:39px;height:39px;display:grid;place-items:center;border-radius:13px;background:#1b2a3d;color:var(--cyan);font-weight:850;font-size:17px}
.shortcut span:last-child{font-size:12px;color:#c4cede}
footer{border-top:1px solid #ffffff12;padding:20px 0 25px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#71819a;font-size:11px}
footer a{color:#8fa2bd;text-decoration:none}
@media(max-width:520px){header{height:65px}.status{font-size:9px;padding:7px 9px}.hero{justify-content:flex-start;padding:90px 0 60px}.orb{width:60px;height:60px;border-radius:19px}.subtitle{font-size:13px}.search{gap:4px;padding:6px;border-radius:15px}.search input{font-size:14px;padding:10px 8px}.search button{padding:0 14px}.shortcuts{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.shortcut{padding:13px 4px;border-radius:13px}.glyph{width:34px;height:34px}.shortcut span:last-child{font-size:10px}footer{font-size:10px}}
</style>
</head>
<body>
<main>
<header><div class="logo">◉ NÉVOA</div><span class="status">SESSÃO LEVE</span></header>
<section class="hero">
<div class="orb" aria-hidden="true">◉</div>
<h1>O que vamos<br><span class="accent">encontrar?</span></h1>
<p class="subtitle">Pesquise na web ou digite um endereço.</p>
<form class="search" id="searchForm" action="https://search.brave.com/search" method="get">
<input id="query" name="q" type="text" placeholder="Pesquisar ou digitar endereço..." autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Pesquisar ou digitar endereço" required>
<button type="submit">Buscar ↗</button>
</form>
<p class="engine">Busca com <strong>Brave Search</strong></p>
<nav class="shortcuts" aria-label="Atalhos">
<a class="shortcut" href="https://search.brave.com/"><span class="glyph">B</span><span>Brave Search</span></a>
<a class="shortcut" href="https://www.wikipedia.org/"><span class="glyph">W</span><span>Wikipedia</span></a>
<a class="shortcut" href="https://www.youtube.com/"><span class="glyph">▶</span><span>YouTube</span></a>
<a class="shortcut" href="https://github.com/"><span class="glyph">⌘</span><span>GitHub</span></a>
</nav>
</section>
<footer><span>© Névoa</span><a href="https://github.com/VNSANTS/nevoa">Código aberto no GitHub</a></footer>
</main>
<script>
const form=document.getElementById('searchForm');
const input=document.getElementById('query');
form.addEventListener('submit',function(event){
  const value=input.value.trim();
  if(!value){event.preventDefault();input.focus();return;}
  const looksLikeUrl=/^(https?:\/\/|[\w-]+\.[a-z]{2,})(\/.*)?$/i.test(value) && !/\s/.test(value);
  if(looksLikeUrl){
    event.preventDefault();
    location.href=/^https?:\/\//i.test(value)?value:'https://'+value;
  }
});
</script>
</body>
</html>
